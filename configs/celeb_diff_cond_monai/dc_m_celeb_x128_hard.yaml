defaults:
  - wandb_keys
  - _self_

globals:
  project: Celeb_Diff_Cond_Monai
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"
  comment: "Conditional diffusion using a harder condition than plain blur: blur + random cutout patches + salt-and-pepper noise + Gaussian noise, stacked. Same backbone/task family as dc_m_celeb_x128_deblur.yaml, but the condition no longer just has high-frequency detail removed - chunks of it are missing or corrupted outright, so the model has to inpaint/denoise, not just sharpen. MONAI counterpart of dc_cc_celeb_x128_hard.yaml - same task, same v2 corrections (wider UNet, more early-stop patience, auxiliary LPIPS loss, noise-filled cutout patches)."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  # Deterministic part of the condition pipeline, baked into the on-disk cache: same blur
  # as dc_m_celeb_x128_deblur.yaml, so blur severity is comparable across the two runs.
  resize_norm_hard_base:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  - Gaussian_Blur:
      blur_sigma: 4.0
      blur_kernel_size: 25
  # Random part of the condition pipeline. NOT referenced by data.celeb_HF.args.transform*
  # below (so it is never baked into the cache) - applied on every access instead, via
  # caching.nondeterministic_transforms, so each epoch sees a fresh corruption draw.
  cond_random:
  - RandomCutout:
      num_patches: 2
      min_frac: 0.15
      max_frac: 0.35
      # Noise fill (not a flat constant) so the model can't shortcut by just detecting
      # "is this patch exactly fill_value?" - it has to actually use surrounding context.
      fill_mode: noise
      noise_std: 1.0
      p: 0.7
  - RandomSaltPepperNoise:
      amount: 0.03
      salt_vs_pepper: 0.5
      salt_value: 1.0
      pepper_value: -1.0
      p: 0.5
  - RandomGaussianNoise:
      sigma_min: 0.05
      sigma_max: 0.25
      p: 0.7
  norm_to_rgb:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8

data:
  celeb_HF:
    processor: ~/dev/fdq_diffusion/hf_preparator_celeb.py
    args:
      # datasets library cache_dir for the public bitmind/celeb-a-hq dataset
      # (downloaded once, reused after). Named hf_cache_dir rather than
      # base_path since fdq's copy_data_to_scratch() rsyncs any 'base_path'
      # arg into ephemeral scratch and trains against that copy instead -
      # which would re-download this every job. base_path: null below is an
      # inert placeholder so that same function's unconditional attribute
      # read doesn't raise (see hf_preparator_celeb.py for details).
      hf_cache_dir: ~/data_ML/celeba_HQ_HF/
      base_path: null
      # single 'train' split only; val/test are carved off by fixed row index
      # (not random), so with subset_*=1.0 below the same images land in
      # train/val/test on every run.
      val_from_train_ratio: 0.05
      test_from_train_ratio: 0.05
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: 2
      train_batch_size: 16
      val_batch_size: 8
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last: true
      # Two transforms of the *same* image, not two different images: hf_preparator_celeb
      # returns a (clean, condition) tuple when transform/transform_test is a list, matching
      # what diffusion_monai.py expects (batch[0] = target, batch[1] = condition).
      # Only the deterministic (blur-only) condition transform runs here - the random
      # cutout/noise stack is applied post-cache, see caching.nondeterministic_transforms.
      transform: [resize_norm, resize_norm_hard_base]
      transform_test: [resize_norm, resize_norm_hard_base]
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false
      # Re-applies transforms.cond_random to the cached condition on every access, so the
      # cutout/noise draw is resampled every epoch instead of baked into the cache once.
      nondeterministic_transforms:
        processor: ~/dev/fdq_diffusion/celeb_cond_augmentation.py

models:
  monaiUNET:
    class_name: monai.networks.nets.DiffusionModelUNet
    args:
      spatial_dims: 2
      in_channels: 6  # 3 (noisy target) + 3 (condition), concatenated
      out_channels: 3
      resblock_updown: true
      num_res_blocks:
      - 2
      - 2
      - 2
      - 2
      - 2
      channels:  # bumped 1.5x from [64,128,256,512,1024]: harder condition needs more capacity
      - 96
      - 192
      - 384
      - 768
      - 1536
      attention_levels:
      - false
      - false
      - false
      - true
      - true
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/diffusion_monai.py
  args:
    epochs: 350
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 100  # bumped from 50: harder task, wanted more patience before quitting
    early_stop_train_loss: 50
    early_stop_nan: 5
    dataloader_name: celeb_HF
    model_name: monaiUNET
    diffusion_nb_steps: 800
    diffusion_nb_plot_steps: 10
    diffusion_scheduler: linear_beta
    diffusion_scheduler_args:
      beta_start: 0.0001
      beta_end: 0.02
    # Auxiliary perceptual loss weight added to the MSE noise/velocity-prediction loss (0
    # disables it). See diffusion_monai.py: reconstructs x0_hat from the model output and
    # compares it to GT via LPIPS, to penalize localized texture/detail loss that a pure
    # noise-space MSE under-penalizes.
    lpips_weight: 0.01

losses:
  MSE:
    class_name: torch.nn.MSELoss
  LPIPS:
    class_name: lpips.LPIPS
    args:
      net: alex

store:
  results_path: ~/data_ML/results
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 4
  use_tensorboard: false
  use_wandb: true
  wandb_project: celeb_diff_cond_x128
  wandb_entity: zhaw_stmd
  img_exp_transform: norm_to_rgb

test:
  processor: ~/dev/fdq_diffusion/diffusion_monai.py
  test_model: last
  args:
    nb_test_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.21
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  ntasks: 1
  cpus_per_task: 8
  gres: gpu:a100sxm:1
  mem: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - datasets
  - monai==1.5.2
  - lpips
