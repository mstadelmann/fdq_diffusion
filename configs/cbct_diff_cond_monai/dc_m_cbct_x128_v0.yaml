defaults:
  - dc_m_cbct_x64_v0
  - _self_

globals:
  project: CBCT_Diff_Cond_Monai
  author: Marc

transforms:
  # HU_to_norm is resolution-independent (pure value-range remap, no spatial op) and
  # is inherited unchanged. HU_to_norm_blur has to be restated in full here (not just
  # the sigma/kernel_size) since Hydra/OmegaConf treats list-valued config keys as
  # atomic - a child overriding part of a list replaces the whole list, not just the
  # items given.
  HU_to_norm_blur:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  - Gaussian_Blur:
      # See dc_m_cbct_x64_v0 for why this is resolution-specific: 10px * 3.0mm/px
      # (x128 spacing) = 30mm physical blur radius, matching x64's 5px * 6.0mm/px.
      blur_sigma: 10.0
      blur_kernel_size: 61

data:
  ctrate:
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_128
      # dc_m_cbct_x64_v0 is a cheap smoke-test config (tiny model/sample count/epochs,
      # V100 on the "gpu" partition) - this is the real experiment, so every field it
      # would otherwise inherit reduced is restated at full scale below.
      max_train_samples: 10000
      max_test_samples: 500

models:
  monaiUNET:
    args:
      num_res_blocks:
      - 2
      - 2
      - 2
      - 2
      channels:
      - 64
      - 128
      - 256
      - 512
      attention_levels:
      - false
      - false
      - false
      - false

train:
  args:
    epochs: 150

store:
  wandb_project: diff_cond_cbct_x128

slurm_cluster:
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  partition: gpu_top
