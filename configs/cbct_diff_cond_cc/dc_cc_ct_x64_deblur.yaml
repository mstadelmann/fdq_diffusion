defaults:
  - wandb_keys
  - _self_

globals:
  project: CBCT_Diff_Cond_CC
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"
  comment: "Conditional diffusion using a blurred GT as condition. chuchichaestli UNet variant of dc_m_ct_x64_deblur.yaml."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  HU_to_norm_blur:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  - Gaussian_Blur:
      # See dc_m_ct_x64_deblur.yaml for why this is resolution-specific. sigma 5px
      # (30mm at x64's 6.0mm/px) left only a featureless blob as condition and the model
      # ignored it - start easier at 2px (12mm), increase once structure is recovered.
      # kernel_size covers +/-3 sigma.
      blur_sigma: 2.0
      blur_kernel_size: 13
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1500
      out_max: 1000
  extract_2d_from_3d:
  - Get2DFrom3D:
      axis: 2
  # Applied to the final generated sample only (train.args.sample_output_transform).
  clamp_norm:
  - CLAMP_abs:
      lower: -1
      upper: 1

data:
  ctrate:
    processor: ~/dev/fdq_diffusion/nifity_preparator.py
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_64
      # fdq's copy_data_to_scratch() unconditionally reads args.base_path for every data
      # source once slurm_cluster.scratch_data_path is set, and crashes with a
      # ConfigAttributeError if the key is missing entirely (must exist, even as null).
      base_path: null
      train_dir: train
      test_dir: valid
      file_extension: _1.nii.gz
      # 50 samples (~1.4k optimizer steps total) was far too little for diffusion.
      # 10k -> 9k train / 1k val; ~2MB per (clean, blurred) 64^3 pair -> ~20GB cache.
      max_train_samples: 10000
      max_test_samples: 500
      sample_selection: sequential
      sample_seed: 42
      # Two transforms of the *same* volume, not two different volumes: nifity_preparator
      # returns a (clean, blurred) tuple when transform_train/test is a list, matching what
      # diffusion_chuchichaestli.py expects (batch[0] = target, batch[1] = condition).
      transform_train: [HU_to_norm, HU_to_norm_blur]
      transform_test: [HU_to_norm, HU_to_norm_blur]
      val_from_train_ratio: 0.1
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      train_batch_size: 8
      val_batch_size: 8
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: true
      shuffle_test: false
      drop_last: true
      num_workers: 4
      ddp_num_workers: 2
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

models:
  # 4 levels, 2 blocks per level and attention at the deepest level (~42M params).
  # block_out_channel_mults is cumulative: [1, 2, 2, 1] -> 64/128/256/256 channels
  # ([1, 2, 2, 4] would be 64/128/256/1024, ~190M). up_block_types is indexed per
  # level like down_block_types (chuchichaestli walks it in reverse).
  ccUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 3
      in_channels: 2  # condition + noisy target, concatenated on the channel dim
      out_channels: 1
      n_channels: 64
      num_blocks_per_level: 2
      down_block_types: [DownBlock, DownBlock, DownBlock, AttnDownBlock]
      up_block_types: [UpBlock, UpBlock, UpBlock, AttnUpBlock]
      block_out_channel_mults: [1, 2, 2, 1]
      time_embedding: true
      time_channels: 512
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  args:
    # ~1.1k steps/epoch at batch 8 -> ~225k optimizer steps.
    epochs: 200
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 50
    early_stop_train_loss: 20
    early_stop_nan: 5
    diffusion_scheduler: linear
    diffusion_nb_steps: 800
    diffusion_shd_beta_start: 0.0001
    diffusion_shd_beta_end: 0.02
    diffusion_nb_plot_steps: 10
    dataloader_name: ctrate
    model_name: ccUNET
    # Clamp the final sample to the [-1, 1] data range (plots + PSNR).
    sample_output_transform: clamp_norm

losses:
  MAE:
    class_name: torch.nn.L1Loss
  MSE:
    class_name: torch.nn.MSELoss
  # Logged by diffusion_chuchichaestli.py for the generated sample, and for the
  # condition itself as a baseline (PSNR_cond) the model has to beat.
  PSNR:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: norm
  PSNR_hu:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: HU

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 5
  use_tensorboard: false
  use_wandb: true
  # Same wandb project as dc_m_ct_x64_deblur.yaml, to compare backbones directly -
  # matches the cbct_diff_gen_x128 pattern shared by dg_m_cbct_x128_v0/dg_cc_ct_x128.
  wandb_project: cbct_diff_cond_x64
  wandb_entity: zhaw_stmd
  img_exp_transform: extract_2d_from_3d

test:
  processor: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  # val loss is noisy - 'last' previously picked a checkpoint right after a spike.
  test_model: best_val
  args:
    nb_test_samples: 20

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.24
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 16
  cpus_per_task_test: 16
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  # fdq caches the whole dataset in host RAM (~25GB here), plus headroom.
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages: [h5py, nibabel, chuchichaestli==0.2.17]
