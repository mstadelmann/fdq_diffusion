defaults:
  - wandb_keys
  - _self_

globals:
  project: Celeb_Diff_Cond_CC
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"
  comment: "Conditional diffusion / outpainting: the condition is the GT image with exactly one half (left/right, chosen at random each epoch) blacked out. The model has to reconstruct the missing half from the visible half, not just sharpen or denoise it. Same backbone/task family as dc_cc_celeb_x128_deblur.yaml. v2: wider UNet, more early-stop patience, and an auxiliary LPIPS loss, aimed at fixing the residual smearing seen on hard (e.g. side-profile) samples in the first pass. The masked half stays a flat fill (not noise): unlike a small cutout patch, the whole half is unrecoverable regardless of fill value, so there's no context-shortcut to close - a flat fill just gives the model a cheap, unambiguous known/unknown boundary."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  # Deterministic part of the condition pipeline, baked into the on-disk cache: just
  # resize/normalize, identical to resize_norm - the masking itself must stay random
  # (see cond_random below), so it can't live here.
  resize_norm_halfface_base:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  # Random part of the condition pipeline. NOT referenced by data.celeb_HF.args.transform*
  # below (so it is never baked into the cache) - applied on every access instead, via
  # caching.nondeterministic_transforms, so which half is masked is resampled every epoch
  # rather than fixed per sample forever.
  cond_random:
  - RandomEdgeMask:
      axis: w
      side: random
      frac: 0.5
      fill_value: 0.0
      p: 1.0
  norm_to_rgb:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8

data:
  celeb_HF:
    processor: ~/dev/fdq_diffusion/hf_preparator_celeb.py
    args:
      # datasets library cache_dir for the public bitmind/celeb-a-hq dataset
      # (downloaded once, reused after). Named hf_cache_dir rather than
      # base_path since fdq's copy_data_to_scratch() rsyncs any 'base_path'
      # arg into ephemeral scratch and trains against that copy instead -
      # which would re-download this every job. base_path: null below is an
      # inert placeholder so that same function's unconditional attribute
      # read doesn't raise (see hf_preparator_celeb.py for details).
      hf_cache_dir: ~/data_ML/celeba_HQ_HF/
      base_path: null
      # single 'train' split only; val/test are carved off by fixed row index
      # (not random), so with subset_*=1.0 below the same images land in
      # train/val/test on every run.
      val_from_train_ratio: 0.05
      test_from_train_ratio: 0.05
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: 2
      train_batch_size: 16
      val_batch_size: 8
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last: true
      # Two transforms of the *same* image, not two different images: hf_preparator_celeb
      # returns a (clean, condition) tuple when transform/transform_test is a list, matching
      # what diffusion_chuchichaestli.py expects (batch[0] = target, batch[1] = condition).
      # Only resize/normalize runs here - the half-face mask is applied post-cache, see
      # caching.nondeterministic_transforms.
      transform: [resize_norm, resize_norm_halfface_base]
      transform_test: [resize_norm, resize_norm_halfface_base]
      ddp_num_workers: 2 # num_workers in DDP is set to 0, as depending on the dataloader, it might be problematic. Use ddp_num_workers to overwrite this.

    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false
      # Re-applies transforms.cond_random to the cached condition on every access, so which
      # half gets masked is resampled every epoch instead of fixed once at cache time.
      nondeterministic_transforms:
        processor: ~/dev/fdq_diffusion/celeb_cond_augmentation.py

models:
  ccUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 2
      in_channels: 6  # 3 (noisy target) + 3 (condition), concatenated
      out_channels: 3
      n_channels: 96  # bumped from 64: outpainting half a face needs more capacity than plain deblurring
      num_blocks_per_level: 1
      down_block_types:
      - DownBlock
      - DownBlock
      - DownBlock
      - AttnDownBlock
      - AttnDownBlock
      up_block_types:
      - UpBlock
      - UpBlock
      - UpBlock
      - AttnUpBlock
      - AttnUpBlock
      block_out_channel_mults:
      - 1
      - 2
      - 2
      - 2
      - 2
      time_embedding: true
      time_channels: 512
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 5.0e-05
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  args:
    epochs: 350
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 100  # bumped from 70: harder task, wanted more patience before quitting
    early_stop_train_loss: 70
    early_stop_nan: 5
    diffusion_scheduler: linear
    diffusion_nb_steps: 800
    diffusion_shd_beta_start: 0.0001
    diffusion_shd_beta_end: 0.02
    diffusion_nb_plot_steps: 10
    dataloader_name: celeb_HF
    model_name: ccUNET
    # Auxiliary perceptual loss weight added to the MSE noise-prediction loss (0 disables
    # it). See diffusion_chuchichaestli.py: reconstructs x0_hat from the predicted noise
    # and compares it to GT via LPIPS, to penalize localized texture/detail loss that a
    # pure noise-space MSE under-penalizes.
    lpips_weight: 0.01

losses:
  MAE:
    class_name: torch.nn.L1Loss
  MSE:
    class_name: torch.nn.MSELoss
  LPIPS:
    class_name: lpips.LPIPS
    args:
      net: alex

store:
  results_path: ~/data_ML/results
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: true
  wandb_project: celeb_diff_cond_x128
  wandb_entity: zhaw_stmd
  img_exp_transform: norm_to_rgb

test:
  processor: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  test_model: best
  args:
    nb_test_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.23
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  ntasks: 1
  world_size: 2
  cpus_per_task: 16
  gres: gpu:a100sxm:2
  gres_test: gpu:a100sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - datasets
  - chuchichaestli==0.2.17
  - lpips
