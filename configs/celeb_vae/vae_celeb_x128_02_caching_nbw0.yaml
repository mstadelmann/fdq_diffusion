defaults:
  - vae_celeb_x128_00_base
  - _self_

globals:
  project: Celeb_VAE
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

data:
  celeb_HDF:
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      num_workers: 0
      compress_cache: false