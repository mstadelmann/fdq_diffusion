defaults:
  - wandb_keys
  - _self_

globals:
  project: Celeb_VAE
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  norm_to_rgb:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8
  
data:
  celeb_HF:
    processor: ~/dev/fdq_diffusion/hf_preparator_celeb.py
    args:
      # datasets library cache_dir for the public bitmind/celeb-a-hq dataset
      # (downloaded once, reused after). Named hf_cache_dir rather than
      # base_path since fdq's copy_data_to_scratch() rsyncs any 'base_path'
      # arg into ephemeral scratch and trains against that copy instead -
      # which would re-download this every job. base_path: null below is an
      # inert placeholder so that same function's unconditional attribute
      # read doesn't raise (see hf_preparator_celeb.py for details).
      hf_cache_dir: ~/data_ML/celeba_HQ_HF/
      base_path: null
      # single 'train' split only; val/test are carved off by fixed row index
      # (not random), so with subset_*=1.0 below the same images land in
      # train/val/test on every run.
      val_from_train_ratio: 0.1
      test_from_train_ratio: 0.05
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: 2
      train_batch_size: 32
      val_batch_size: 32
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last: true
      transform: resize_norm
      transform_test: resize_norm
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

models:
  monaivae:
    class_name: monai.networks.nets.AutoencoderKL
    args:
      spatial_dims: 2
      in_channels: 3
      out_channels: 3
      latent_channels: 3
      channels:
      - 64
      - 128
      - 256
      num_res_blocks: 2
      norm_num_groups: 32
      norm_eps: 1.0e-06
      attention_levels:
      - false
      - false
      - false
      with_encoder_nonlocal_attn: false
      with_decoder_nonlocal_attn: false
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/vae.py
  args:
    epochs: 10
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 20
    early_stop_train_loss: 20
    early_stop_nan: 5
    kl_loss_weight: 1.0e-06
    dataloader_name: celeb_HF
    model_name: monaivae

losses:
  MAE:
    class_name: torch.nn.L1Loss

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: false
  checkpoint_frequency: 5
  use_tensorboard: false
  use_wandb: true
  wandb_project: celeb_vae_x128
  wandb_entity: zhaw_stmd
  img_exp_transform: norm_to_rgb

test:
  processor: ~/dev/fdq_diffusion/vae.py
  test_model: best
  args:
    nb_test_samples: 20
    nb_export_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.21
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 8
  gres: gpu:a100sxm:1
  gres_test: gpu:a100sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - datasets
  - monai==1.5.2
