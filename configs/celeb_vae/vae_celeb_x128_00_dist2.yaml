defaults:
  - vae_celeb_x128_00_base
  - _self_

globals:
  project: Celeb_VAE
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

# vae_celeb_x128_00_base.yaml is now a baseline/memory-check-only config (2 epochs) -
# this is the real 2-GPU training run, so epochs is restored explicitly.
train:
  args:
    epochs: 400

data:
  celeb_HF:
    args:
      ddp_num_workers: 2 # num_workers in DDP is set to 0, as depending on the dataloader, it might be problematic. Use ddp_num_workers to overwrite this.


slurm_cluster:
  cpus_per_task: 16
  gres: gpu:a100sxm:2
  gres_test: gpu:a100sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  world_size: 2