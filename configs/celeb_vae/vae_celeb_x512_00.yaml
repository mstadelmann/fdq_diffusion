defaults:
  - vae_celeb_x128_00_base
  - _self_

globals:
  project: Celeb_VAE
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 512
      w: 512
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1

data:
  celeb_HF:
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

train:
  args:
    epochs: 400

store:
  wandb_project: celeb_vae_x512

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.18
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 16
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  mem: 160G
  mem_test: 160G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  world_size: 1
  additional_pip_packages:
  - datasets
  - monai==1.5.2
