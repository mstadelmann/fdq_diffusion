defaults:
  - dg_m_cele_x128_00_base_dist2
  - _self_

globals:
  project: Celeb_Generation
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 256
      w: 256
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1

store:
  wandb_project: celeb_diff_gen_x256

slurm_cluster:
  gres: gpu:h200sxm:2
  gres_test: gpu:h200sxm:1
