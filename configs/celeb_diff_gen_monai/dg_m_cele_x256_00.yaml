defaults:
  - wandb_keys
  - dg_m_cele_x128_00_base
  - _self_

globals:
  project: Celeb_Generation
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 256
      w: 256
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1

store:
  wandb_project: diff_gen_celeb_x256


slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.12
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  ntasks: 1
  cpus_per_task: 8
  gres: gpu:h200sxm:1
  mem: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - monai==1.5.2
