defaults:
  - wandb_keys
  - dg_m_cele_x128_00_base
  - _self_

globals:
  project: Celeb_Generation
  author: Marc

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -0.5
      out_max: 0.5
  norm_to_rgb:
  - ReRange:
      in_min: -0.5
      in_max: 0.5
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null


