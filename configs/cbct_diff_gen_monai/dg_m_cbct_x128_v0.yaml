defaults:
  - wandb_keys
  - _self_

globals:
  project: CBCT_Diff_Gen
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1500
      out_max: 1000
  extract_2d_from_3d:
  - Get2DFrom3D:
      axis: 2

data:
  ctrate:
    processor: ~/dev/fdq_diffusion/nifity_preparator.py
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_128
      base_path: null
      train_dir: train
      test_dir: valid
      file_extension: _1.nii.gz
      max_train_samples: 10000
      max_test_samples: 500
      sample_selection: sequential
      sample_seed: 42
      transform_train: HU_to_norm
      transform_test: HU_to_norm
      val_from_train_ratio: 0.1
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      train_batch_size: 4
      val_batch_size: 2
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: true
      shuffle_test: false
      drop_last: true
      num_workers: 4
      ddp_num_workers: 2
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

models:
  monaiUNET:
    class_name: monai.networks.nets.DiffusionModelUNet
    args:
      spatial_dims: 3
      in_channels: 1
      out_channels: 1
      resblock_updown: true
      num_res_blocks:
      - 2
      - 2
      - 2
      - 2
      channels:
      - 64
      - 128
      - 256
      - 512
      attention_levels:
      - false
      - false
      - false
      - false
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/diffusion_monai.py
  args:
    epochs: 10
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 50
    early_stop_train_loss: 20
    early_stop_nan: 5
    dataloader_name: ctrate
    model_name: monaiUNET
    diffusion_nb_steps: 800
    diffusion_nb_plot_steps: 10
    diffusion_scheduler: linear_beta
    diffusion_scheduler_args:
      beta_start: 0.0001
      beta_end: 0.02

losses:
  MAE:
    class_name: torch.nn.L1Loss
  MSE:
    class_name: torch.nn.MSELoss

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 5
  use_tensorboard: false
  use_wandb: true
  wandb_project: cbct_diff_gen_x128
  wandb_entity: zhaw_stmd
  img_exp_transform: extract_2d_from_3d

test:
  processor: ~/dev/fdq_diffusion/diffusion_monai.py
  test_model: last
  args:
    nb_test_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.24
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - nibabel
  - monai==1.5.2
