defaults:
  - dg_m_cbct_x128_v0
  - _self_

globals:
  project: CBCT_Diff_Gen
  author: Marc

mode:
  run_test_auto: true

train:
  args:
    epochs: 500

slurm_cluster:
  world_size: 2
  cpus_per_task: 16
  cpus_per_task_test: 8
  gres: gpu:h200sxm:2
  gres_test: gpu:h200sxm:1
  mem: 280G
  mem_test: 180G
  # rank 0 alone does the post-epoch wandb image upload + checkpoint save after
  # every 800-step sampling pass; default 10min NCCL watchdog timeout aborted
  # job 58159 mid-upload, so raise it with margin here.
  ddp_init_timeout_min: 30
