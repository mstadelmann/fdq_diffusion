defaults:
  - fm_meta_cele_x128_v1
  - _self_

globals:
  project: Celeb_FM_Generation
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

train:
  args:
    ema_decay: 0.9995

models:
  metaUNET:
    args:
      num_heads: -1
      num_head_channels: 64
      resblock_updown: true

