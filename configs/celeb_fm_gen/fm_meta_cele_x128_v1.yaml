defaults:
  - fm_meta_cele_x128_v0
  - _self_

globals:
  project: Celeb_FM_Generation
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

data:
  celeb_HDF:
    args:
      train_batch_size: 16
      val_batch_size: 8

models:
  metaUNET:
    args:
      num_res_blocks: 2
      attention_resolutions:
      - 2
      - 4
      - 8
      dropout: 0.1
      channel_mult:
      - 1
      - 2
      - 2
      - 4
      conv_resample: true

