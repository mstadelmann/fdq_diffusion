defaults:
  - wandb_keys
  - _self_

globals:
  project: CBCT_VAE
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1500
      out_max: 1000
  extract_2d_from_3d:
  - Get2DFrom3D:
      axis: 2
  extract_2d_from_3d_sag:
  - Get2DFrom3D:
      axis: 3
  extract_2d_from_3d_cor:
  - Get2DFrom3D:
      axis: 4

data:
  ctrate:
    processor: ~/dev/fdq_diffusion/nifity_preparator.py
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_64
      # fdq's copy_data_to_scratch() unconditionally reads args.base_path for every data
      # source once slurm_cluster.scratch_data_path is set, and crashes with a
      # ConfigAttributeError if the key is missing entirely (must exist, even as null).
      # This must stay null (not set to root_path!): setting it would make fdq rsync the
      # *entire* dataset root to scratch on every job, defeating max_train_samples/
      # max_test_samples - files are read directly from root_path over the network instead.
      base_path: null
      train_dir: train
      test_dir: valid
      # Every scan has 2+ reconstruction files (..._1.nii.gz, ..._2.nii.gz, rarely more).
      # file_extension is matched as a plain filename suffix (glob "**/*<file_extension>"),
      # so this selects only the first reconstruction per scan instead of every file.
      file_extension: _1.nii.gz
      # processed_64 volumes are already HU-calibrated and clipped to [-1000, 1000],
      # unlike the raw CT-RATE release - no metadata_dir/RescaleSlope lookup needed here.
      # Cap how many volumes are actually used per split - the full train split still has
      # ~19k patients / ~22k matching files. Set to null to use every discovered file instead.
      max_train_samples: 10000
      max_test_samples: 500
      # "sequential" = first N files in sorted order (deterministic).
      # "random" = seeded random subset (same sample_seed -> same files every run).
      sample_selection: sequential
      sample_seed: 42
      transform_train: HU_to_norm
      transform_test: HU_to_norm
      val_from_train_ratio: 0.1
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      train_batch_size: 10
      val_batch_size: 2
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: true
      shuffle_test: false
      drop_last: true
      num_workers: 4
      ddp_num_workers: 2
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

models:
  monaivae:
    class_name: monai.networks.nets.AutoencoderKL
    args:
      spatial_dims: 3
      in_channels: 1
      out_channels: 1
      latent_channels: 1
      channels:
      - 64
      - 128
      - 256
      num_res_blocks: 2
      norm_num_groups: 32
      norm_eps: 1.0e-06
      attention_levels:
      - false
      - false
      - false
      with_encoder_nonlocal_attn: false
      with_decoder_nonlocal_attn: false
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/vae.py
  args:
    epochs: 10
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 20
    early_stop_train_loss: 20
    early_stop_nan: 5
    kl_loss_weight: 1.0e-06
    dataloader_name: ctrate
    model_name: monaivae

losses:
  MAE:
    class_name: torch.nn.L1Loss
  PSNR:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: norm
  PSNR_hu:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: HU

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: false
  checkpoint_frequency: 5
  use_tensorboard: false
  use_wandb: true
  wandb_project: cbct_vae_x64
  wandb_entity: zhaw_stmd
  img_exp_transform: extract_2d_from_3d

test:
  processor: ~/dev/fdq_diffusion/vae.py
  test_model: best
  args:
    nb_test_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.24
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - nibabel
  - monai==1.5.2
