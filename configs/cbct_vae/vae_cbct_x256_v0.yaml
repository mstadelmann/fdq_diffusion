defaults:
  - vae_cbct_x64_v0
  - _self_

globals:
  project: CBCT_VAE
  author: Marc

data:
  ctrate:
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_256
      # Each resolution tier is 2x the previous in every axis (256x256x128 here vs
      # 128x128x64 for x128), i.e. 8x the voxel count per volume. train_batch_size
      # is cut accordingly (10 -> 2, matching val_batch_size 2 -> 1) as a starting
      # point to avoid an immediate OOM.
      train_batch_size: 2
      val_batch_size: 1

store:
  wandb_project: cbct_vae_x256

# Single GPU on purpose: memory consumption at this resolution hasn't been
# measured yet, so this composes from the plain vae_cbct_x64_v0 base (1 GPU,
# 120G/120G mem, same as the 64px tier) rather than vae_cbct_x64_v0_dist2, to
# see actual usage before committing to a 2-GPU run. Notably, going from 64px
# to 128px didn't need a mem bump beyond what dist2 already provided (see
# vae_cbct_x128_v0.yaml), so 120G may well be enough here too - or it may not,
# which is exactly what this run is meant to find out. See
# vae_cbct_x256_v0_dist2.yaml for the 2-GPU version once you know more.
