defaults:
  - vae_cbct_x64_v0
  - _self_

globals:
  project: CBCT_VAE
  author: Marc

data:
  ctrate:
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_256
      train_batch_size: 1
      val_batch_size: 1
    # fdq's dataset caching loads the whole split into RAM; at x256 that OOM-killed the dist2 job
    caching:
      enabled: false

train:
  args:
    epochs: 50

store:
  wandb_project: cbct_vae_x256

slurm_cluster:
  mem: 320G
  mem_test: 320G
