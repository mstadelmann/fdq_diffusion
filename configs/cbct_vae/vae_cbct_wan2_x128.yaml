defaults:
  - wandb_keys
  - _self_

globals:
  project: CBCT_VAE
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"

mode:
  run_train: false
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1500
      out_max: 1000
  # 2D slices for plotting (axial / sagittal / coronal); same for all CBCT autoencoder
  # experiments (VAE, MAISI, Wan2.2) so their test plots are directly comparable.
  extract_2d_from_3d:
  - Get2DFrom3D:
      axis: 2
  - Float32
  - CLAMP_perc:
      lower_perc: 0.01
      upper_perc: 0.99
  - ReRange_minmax:
      out_min: 0
      out_max: 1
  extract_2d_from_3d_sag:
  - Get2DFrom3D:
      axis: 4
  - Float32
  - CLAMP_perc:
      lower_perc: 0.01
      upper_perc: 0.99
  - ReRange_minmax:
      out_min: 0
      out_max: 1
  extract_2d_from_3d_cor:
  - Get2DFrom3D:
      axis: 3
  - Float32
  - CLAMP_perc:
      lower_perc: 0.01
      upper_perc: 0.99
  - ReRange_minmax:
      out_min: 0
      out_max: 1

data:
  ctrate:
    processor: ~/dev/fdq_diffusion/nifity_preparator.py
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_128
      # fdq's copy_data_to_scratch() unconditionally reads args.base_path for every data
      # source once slurm_cluster.scratch_data_path is set, and crashes with a
      # ConfigAttributeError if the key is missing entirely (must exist, even as null).
      base_path: null
      train_dir: train
      test_dir: valid
      # Every scan has 2+ reconstruction files (..._1.nii.gz, ..._2.nii.gz, rarely more).
      # file_extension is matched as a plain filename suffix, so this selects only the
      # first reconstruction per scan instead of every file.
      file_extension: _1.nii.gz
      # processed_128 volumes are already HU-calibrated and clipped to [-1000, 1000] -
      # no metadata_dir/RescaleSlope lookup needed here.
      max_train_samples: 2000
      max_test_samples: 200
      sample_selection: sequential
      sample_seed: 42
      transform_train: HU_to_norm
      transform_test: HU_to_norm
      val_from_train_ratio: 0.1
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      train_batch_size: 10
      val_batch_size: 2
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: true
      shuffle_test: false
      drop_last: true
      num_workers: 4
      ddp_num_workers: 2
    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

train:
  path: ~/dev/fdq_diffusion/wan2.py
  args:
    use_GPU: true
    use_AMP: true
    dataloader_name: ctrate

losses:
  MAE:
    class_name: torch.nn.L1Loss
  PSNR:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: norm
  PSNR_hu:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: HU

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  checkpoint_frequency: 5
  use_wandb: true
  wandb_project: cbct_vae_wan2_x128
  wandb_entity: zhaw_stmd
  img_exp_transform: extract_2d_from_3d

test:
  processor: ~/dev/fdq_diffusion/wan2.py
  test_model: best
  args:
    nb_test_samples: 20

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.24
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - nibabel
  - diffusers==0.40.0
  - accelerate
  - safetensors
