defaults:
  - vae_cbct_maisi_x256
  - _self_

globals:
  project: CBCT_VAE
  author: Marc

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1000
      in_max: 1000
      out_min: -1
      out_max: 1
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1000
      out_max: 1000
