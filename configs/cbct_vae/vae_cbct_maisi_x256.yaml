defaults:
  - wandb_keys
  - _self_

globals:
  project: CBCT_LatentDiff
  author: Marc

mode:
  run_train: false
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  HU_to_norm:
  - Float32
  - ReRange:
      in_min: -1500
      in_max: 1000
      out_min: -1
      out_max: 1
  norm_to_HU:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: -1500
      out_max: 1000
  extract_2d_from_3d:
  - Get2DFrom3D:
      axis: 2
  - Float32
  - CLAMP_perc:
      lower_perc: 0.01
      upper_perc: 0.99
  - ReRange_minmax:
      out_min: 0
      out_max: 1

data:
  ctrate:
    processor: ~/dev/fdq_diffusion/hdf_preparator_v2.py
    args:
      train_files_path:
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_0_v03.hdf
      test_files_path:
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_test_batch_0_v03.hdf
      _train_files_path:
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_0_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_1_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_2_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_3_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_4_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_train_batch_5_v03.hdf
      _test_files_path:
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_test_batch_0_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_test_batch_1_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_test_batch_2_v03.hdf
      - /cluster/projects/ac3t/data/ac3t_ct_rate/size_256/v03/final_hdfs/nproj_491/ct_rate_test_batch_3_v03.hdf
      hdf_ds_key_request:
      - Vol_full: HU_to_norm
      hdf_ds_key_request_test:
      - Vol_full: HU_to_norm
      data_is_3d: true
      file_extension: hdf
      val_from_train_ratio: 0.1
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      train_batch_size: 2
      val_batch_size: 2
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last: true

train:
  path: ~/dev/fdq_diffusion/maisi.py
  args:
    # maisi.py's fdq_train() always raises NotImplementedError (this is a test-only
    # script), so this value is never actually used - it just has to be present
    # because fdqExperiment.__init__ reads cfg.train.args.epochs unconditionally.
    epochs: 1
    use_GPU: true
    use_AMP: true
    dataloader_name: ctrate

losses:
  MAE:
    class_name: torch.nn.L1Loss
  PSNR:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: norm
  PSNR_hu:
    path: ~/dev/fdq_diffusion/common.py
    class_name: PSNR
    args:
      mode: HU

store:
  results_path: ~/data_ML/results
  img_exp_nb: 8
  checkpoint_frequency: 5
  use_wandb: true
  wandb_project: cbct_vae
  wandb_entity: stmd
  img_exp_transform: extract_2d_from_3d

test:
  processor: ~/dev/fdq_diffusion/maisi.py
  test_model: best
  args:
    nb_test_samples: 20

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.15
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:h200sxm:1
  gres_test: gpu:h200sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - safetensors
