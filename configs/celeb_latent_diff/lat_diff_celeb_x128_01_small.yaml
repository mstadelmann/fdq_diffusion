defaults:
  - lat_diff_celeb_x128_00_base
  - wandb_keys
  - _self_

globals:
  project: Celeb_LatentDiff
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null


models:
  monaivae:
    class_name: monai.networks.nets.AutoencoderKL
    trained_model_path: /cluster/home/stmd/data_ML/results/Celeb_VAE/vae_celeb_x128_04_small/20260515_03_54_08__frosty_visvesvaraya__18468/best_val_monaivae_e247.fdqm
    freeze: true
    args:
      spatial_dims: 2
      in_channels: 3
      out_channels: 3
      latent_channels: 3
      channels:
      - 32
      - 64
      - 128
      num_res_blocks: 2
      norm_num_groups: 32
      norm_eps: 1.0e-06
      attention_levels:
      - false
      - false
      - false
      with_encoder_nonlocal_attn: false
      with_decoder_nonlocal_attn: false
      
  ccUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 2
      in_channels: 3
      out_channels: 3
      n_channels: 128
      num_blocks_per_level: 2
      down_block_types:
      - DownBlock
      - DownBlock
      - DownBlock
      - DownBlock
      - DownBlock
      up_block_types:
      - UpBlock
      - UpBlock
      - UpBlock
      - UpBlock
      - UpBlock
      block_out_channel_mults:
      - 1
      - 1
      - 2
      - 2
      - 4
      time_embedding: true
      time_channels: 512
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95


slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.12
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  ntasks: 1
  cpus_per_task: 8
  gres: gpu:1
  mem: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  resume_chpt_path: null
  additional_pip_packages:
  - h5py
  - chuchichaestli==0.2.17
  - monai==1.5.2
