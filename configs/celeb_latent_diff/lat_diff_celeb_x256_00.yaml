defaults:
  - lat_diff_celeb_x128_00_base
  - _self_

globals:
  project: Celeb_LatentDiff
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 256
      w: 256
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  norm_to_rgb:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8

models:
  monaivae:
    trained_model_path: /cluster/home/stmd/data_ML/results/Celeb_VAE/vae_celeb_x256_00/20260724_15_56_57__heuristic_noether__38396/last_monaivae_e237.fdqm

store:
  wandb_project: celeb_lat_diff_x256

