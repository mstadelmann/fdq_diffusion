defaults:
  - wandb_keys
  - _self_

globals:
  project: Celeb_Generation
  author: Marc
  uv_cache_dir: "/cluster/home/stmd/UV_CACHE"

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_norm:
  - Float32
  - Resize_HW:
      h: 128
      w: 128
  - ReRange:
      in_min: 0
      in_max: 255
      out_min: -1
      out_max: 1
  norm_to_rgb:
  - ReRange:
      in_min: -1
      in_max: 1
      out_min: 0
      out_max: 255
  - CLAMP_abs:
      lower: 0
      upper: 255
  - Uint8

data:
  celeb_HDF:
    processor: ~/dev/fdq_diffusion/hdf_preparator_celeb.py
    args:
      base_path: ~/data_ML/celeba_hq_256/celeb_train_and_test/
      file_extension: hdf
      val_from_train_ratio: 0.05
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: 2
      train_batch_size: 16
      val_batch_size: 8
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      drop_last: true
      hdf_ds_key_request:
      - '*': resize_norm
      hdf_ds_key_request_test:
      - '*': resize_norm
      ddp_num_workers: 2 # num_workers in DDP is set to 0, as depending on the dataloader, it might be problematic. Use ddp_num_workers to overwrite this.

    caching:
      enabled: true
      cache_dir: /scratch/fdq_cache/
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false
      pin_memory: true
      compress_cache: false

models:
  ccUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 2
      in_channels: 3
      out_channels: 3
      n_channels: 64
      num_blocks_per_level: 1
      down_block_types:
      - DownBlock
      - DownBlock
      - DownBlock
      - AttnDownBlock
      - AttnDownBlock
      up_block_types:
      - UpBlock
      - UpBlock
      - UpBlock
      - AttnUpBlock
      - AttnUpBlock
      block_out_channel_mults:
      - 1
      - 2
      - 2
      - 2
      - 2
      time_embedding: true
      time_channels: 512
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 5.0e-05
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 20
        gamma: 0.95

train:
  path: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  args:
    epochs: 350
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 70
    early_stop_train_loss: 70
    early_stop_nan: 5
    diffusion_scheduler: linear
    diffusion_nb_steps: 800
    diffusion_shd_beta_start: 0.0001
    diffusion_shd_beta_end: 0.02
    diffusion_nb_plot_steps: 10
    dataloader_name: celeb_HDF
    model_name: ccUNET

losses:
  MAE:
    class_name: torch.nn.L1Loss
  MSE:
    class_name: torch.nn.MSELoss

store:
  results_path: ~/data_ML/results
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 2
  use_tensorboard: false
  use_wandb: true
  wandb_project: diff_gen_celeb_x128
  wandb_entity: stmd
  img_exp_transform: norm_to_rgb

test:
  processor: ~/dev/fdq_diffusion/diffusion_chuchichaestli.py
  test_model: best
  args:
    nb_test_samples: 10

slurm_cluster:
  fdq_test_repo: false
  fdq_version: 0.1.16
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: /scratch/fdq_data/
  log_path: ~/dev/fdq_diffusion/slurm_log
  job_time: 1400
  stop_grace_time: 15
  ntasks: 1
  world_size: 2
  cpus_per_task: 16
  gres: gpu:a100sxm:2
  gres_test: gpu:a100sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: true
  additional_pip_packages:
  - h5py
  - chuchichaestli==0.2.17
