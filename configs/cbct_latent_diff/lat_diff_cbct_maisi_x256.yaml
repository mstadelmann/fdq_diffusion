defaults:
  - lat_diff_cbct_maisi_x128
  - _self_

globals:
  project: CBCT_LatentDiff
  author: Marc

data:
  ctrate:
    args:
      root_path: /cluster/projects/2026_stmd_orthosense/public_data/ct-rate/preproc_256
      # preproc_256 volumes are 8x the voxel count of preproc_128, but only the (frozen,
      # no_grad) MAISI encoder sees them - the UNet trains on 4x64x64x32 latents.
      # Batch size halved as a first guess; this hasn't been run yet.
      train_batch_size: 2
      val_batch_size: 1
    # fdq's dataset caching loads the whole split into RAM; at x256 that OOM-killed
    # dg_cc_ct_x256 and vae_cbct_x256_v0_dist2
    caching:
      enabled: false

store:
  wandb_project: cbct_lat_diff_x256
